[package]
name = "aws-emulator-server"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
http = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
aws-smithy-runtime-api = { version = "1.11.3", features = ["client", "http-1x"] }
aws-smithy-types = "1"
http-body-util = "0.1.3"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
tokio-rustls = "0.26"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
# fork: `sigv4a` derives the key pair a SigV4A signature is verified with.
aws-sigv4 = { version = "1", features = ["http1", "sigv4a"] }
aws-credential-types = "1"
aws-lc-rs = "1"
# fork: a SigV4A signature is hex-encoded DER.
hex = "0.4"
percent-encoding = "2"
time = { version = "0.3.55", default-features = false, features = ["parsing", "std"] }
yasna = "0.5"
emulator-paths = { path = "../emulator-paths", package = "aws-emulator-emulator-paths", version = "*" }
emulator-telemetry = { path = "../emulator-telemetry", package = "aws-emulator-emulator-telemetry", version = "*" }
aws-smithy-schema-server = { path = "../smithy-schema-server", package = "aws-emulator-smithy-schema-server", version = "*" }

# fork: the crate is vendored without the dev-dependencies its unit tests use. The root
# workspace excludes it, so its tests run on their own:
# `cargo test --manifest-path vendor/server/Cargo.toml --lib`.
[dev-dependencies]
assert2 = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full", "test-util"] }
