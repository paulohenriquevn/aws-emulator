# The operator reads Secrets Manager and STS at the emulator. Its AWS provider takes a
# per-service endpoint from these variables; @ENDPOINT@ is filled in by run.sh.
extraEnv:
- name: AWS_ENDPOINT_URL
  value: @ENDPOINT@
- name: AWS_SECRETSMANAGER_ENDPOINT
  value: @ENDPOINT@
- name: AWS_STS_ENDPOINT
  value: @ENDPOINT@
- name: AWS_CA_BUNDLE
  value: /etc/emulator/ca.pem
extraVolumes:
- name: emulator-ca
  configMap:
    name: emulator-ca
extraVolumeMounts:
- name: emulator-ca
  mountPath: /etc/emulator
  readOnly: true
