# The operator reads Secrets Manager and STS at the emulator. Its AWS provider takes a
# per-service endpoint from these variables; @ENDPOINT@ is filled in by run.sh.
extraEnv:
- name: AWS_ENDPOINT_URL
  value: @ENDPOINT@
- name: AWS_SECRETSMANAGER_ENDPOINT
  value: @ENDPOINT@
- name: AWS_STS_ENDPOINT
  value: @ENDPOINT@
# The Go SDK's IRSA credentials call STS with a client built before AWS_ENDPOINT_URL is
# read; only the STS-specific variable reaches it (see fork/README.md, Kubernetes).
- name: AWS_ENDPOINT_URL_STS
  value: @ENDPOINT@
- name: AWS_CA_BUNDLE
  value: /etc/emulator/ca.pem
# AWS_CA_BUNDLE reaches only the SDK's default HTTP client; SSL_CERT_FILE is what Go's
# own TLS stack trusts, whatever client a component builds.
- name: SSL_CERT_FILE
  value: /etc/emulator/ca.pem
log:
  level: debug
extraVolumes:
- name: emulator-ca
  configMap:
    name: emulator-ca
extraVolumeMounts:
- name: emulator-ca
  mountPath: /etc/emulator
  readOnly: true
