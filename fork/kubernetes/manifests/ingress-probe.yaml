# An Ingress the AWS Load Balancer Controller turns into an internal ALB whose target
# group holds the kind node's instance on the Service's NodePort. IP targets would need
# the pod's VPC network interface, which a kind pod does not have.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: probes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
      - name: echo
        image: nginx:1.29.3-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: probes
spec:
  type: NodePort
  selector:
    app: echo
  ports:
  - port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
  namespace: probes
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: instance
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: echo
            port:
              number: 80
