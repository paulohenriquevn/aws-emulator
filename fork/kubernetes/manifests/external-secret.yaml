# A store with no auth block: the operator uses its own identity, the IRSA role its
# service account is annotated with.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secrets-manager
  namespace: probes
spec:
  provider:
    aws:
      service: SecretsManager
      region: @REGION@
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-secret
  namespace: probes
spec:
  refreshInterval: 10s
  secretStoreRef:
    name: secrets-manager
    kind: SecretStore
  target:
    name: external-secret
  data:
  - secretKey: value
    remoteRef:
      key: probes/external-secret
