# fork: runs the same Terraform acceptance fixtures against Floci (https://floci.io), an
# MIT-licensed AWS emulator, so the choice between this fork and Floci rests on the same
# seven fixtures and the same pass criteria (apply, an empty re-plan, destroy).
#
# Informational: it never blocks a merge, and it builds nothing from this repository.
name: fork floci comparison

on:
  pull_request:
    branches: [develop, main]
    paths:
      - fork/acceptance/**
      - .github/workflows/fork-floci-comparison.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-floci-comparison-${{ github.ref }}
  cancel-in-progress: true

env:
  FLOCI_IMAGE: floci/floci:2.5.0

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Pull the Floci image
        run: docker pull "$FLOCI_IMAGE"

      - name: Terraform acceptance fixtures against Floci
        env:
          ACCEPTANCE_WORK: ${{ runner.temp }}/acceptance
          ACCEPTANCE_PORT: "4566"
        run: fork/acceptance/run.sh "docker:$FLOCI_IMAGE"

      - name: Remove the containers Floci started
        if: ${{ always() }}
        run: docker ps -aq | xargs -r docker rm -f

      - name: Keep the acceptance logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: floci-acceptance-logs
          path: |
            ${{ runner.temp }}/acceptance/*/terraform.log
            ${{ runner.temp }}/acceptance/*/home/emulator.log
          if-no-files-found: ignore
